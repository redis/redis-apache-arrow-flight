name: Qualified release image
on:
  repository_dispatch:
    types: [qualified-release-pair]
  workflow_dispatch:
    inputs:
      version:
        description: Published coordinated release version to build or repair
        type: string
        required: true
  pull_request:
    paths:
      - .github/workflows/release-image.yml
      - scripts/verify-release-pair.py
      - scripts/test_verify_release_pair.py
      - Dockerfile
permissions:
  contents: read
concurrency:
  group: qualified-image-${{ inputs.version || github.event.client_payload.version || github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.pair.outputs.sha }}
      version: ${{ steps.pair.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify the coordinator's published release
        id: pair
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ inputs.version || github.event.client_payload.version }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COORDINATOR_APP_SLUG: ${{ vars.RELEASE_COORDINATOR_APP_SLUG }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "version=v0.0.0-dev" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/verify-release-pair.py --version "$VERSION"
          fi
  test:
    needs: resolve
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
  image:
    needs: [test, resolve]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # 1.2.3 and 1.2 (and latest) for v1.2.3; only 1.2.3-rc1 for a
          # prerelease.
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=redis-flight-server
            org.opencontainers.image.description=Apache Arrow Flight and Flight SQL server for Redis
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}

      # The amd64 image, loaded to check it runs and reports the version.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ env.VERSION }}
          tags: redis-flight-server:check
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the image
        run: |
          test "$(docker run --rm redis-flight-server:check -version)" = "$VERSION"
          test "$(docker image inspect redis-flight-server:check --format '{{json .Config.Healthcheck.Test}}')" = '["NONE"]'

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

