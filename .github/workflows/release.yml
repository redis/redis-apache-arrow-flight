# Releases a tag: runs the test workflow on it, builds static binaries for
# Linux (amd64, arm64) and macOS (arm64) and a multi-arch container image,
# checks each binary on its own platform, then pushes the image to
# ghcr.io/alberttwong/redis-apache-arrow-flight and attaches the binaries,
# with SHA-256 checksums, to the tag's GitHub release (made if there is none
# yet; a tag with a "-" makes a prerelease).
#
# Runs when a v* tag is pushed, or by hand for an existing tag (its assets
# are replaced and its image pushed again). Pull requests that change this
# file, the Dockerfile or the Makefile build and check everything without
# publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (its assets are replaced)
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - Makefile
      - scripts/**
      - .github/actions/private-go/**

permissions:
  contents: read

concurrency:
  # Not the test workflow's group (Release-<ref>), which it runs in.
  group: release-build-${{ inputs.tag || github.ref }}

env:
  # The version stamped into the binaries and the image, and in asset names.
  VERSION: ${{ github.event_name == 'pull_request' && 'v0.0.0-dev' || inputs.tag || github.ref_name }}
  REF: ${{ inputs.tag || github.sha }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets:
      REDIS_ADBC_READ_TOKEN: ${{ secrets.REDIS_ADBC_READ_TOKEN }}
    with:
      ref: ${{ inputs.tag || github.sha }}

  # The server needs no cgo, so one runner cross-compiles every platform.
  binaries:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/private-go
        with:
          token: ${{ secrets.REDIS_ADBC_READ_TOKEN }}

      - name: Build
        run: |
          make dist VERSION="$VERSION"
          ls -l dist

      - name: Check
        run: |
          (cd dist && sha256sum -c ./*.sha256)
          mkdir -p "$RUNNER_TEMP/check"
          for f in dist/*.tar.gz; do tar -xzf "$f" -C "$RUNNER_TEMP/check"; done
          bin() { echo "$RUNNER_TEMP/check/redis-flight-server-$VERSION-$1/redis-flight-server"; }
          file "$(bin linux-amd64)" | grep -q 'x86-64.*statically linked'
          file "$(bin linux-arm64)" | grep -q 'aarch64.*statically linked'
          file "$(bin darwin-arm64)" | grep -q 'Mach-O 64-bit.*arm64'

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Each binary runs on its own platform; on Linux it also serves, against
  # a Redis in Docker, until its health check passes.
  verify:
    name: verify (${{ matrix.platform }})
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Run
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          name="redis-flight-server-$VERSION-$PLATFORM"
          (cd dist && shasum -a 256 -c "$name.tar.gz.sha256")
          tar -xzf "dist/$name.tar.gz"
          server="$PWD/$name/redis-flight-server"
          test "$("$server" -version)" = "$VERSION"
          "$server" -h 2>&1 | grep -q -- -healthcheck
          if [ "$RUNNER_OS" = Linux ]; then
            docker run --detach --rm -p 127.0.0.1:6379:6379 redis:8.6.2
            "$server" -listen 127.0.0.1:8815 &
            for _ in $(seq 30); do
              "$server" -healthcheck -listen 127.0.0.1:8815 && exit 0
              sleep 1
            done
            exit 1
          fi

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # 1.2.3 and 1.2 (and latest) for v1.2.3; only 1.2.3-rc1 for a
          # prerelease.
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=redis-flight-server
            org.opencontainers.image.description=Apache Arrow Flight and Flight SQL server for Redis
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}

      # The amd64 image, loaded to check it runs and reports the version.
      - uses: docker/build-push-action@v7
        with:
          context: .
          secrets: |
            redis_adbc_token=${{ secrets.REDIS_ADBC_READ_TOKEN }}
          platforms: linux/amd64
          build-args: VERSION=${{ env.VERSION }}
          tags: redis-flight-server:check
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the image
        run: |
          test "$(docker run --rm redis-flight-server:check -version)" = "$VERSION"
          docker image inspect redis-flight-server:check --format '{{json .Config.Healthcheck}}' | grep -q -- -healthcheck

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          secrets: |
            redis_adbc_token=${{ secrets.REDIS_ADBC_READ_TOKEN }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name != 'pull_request'
    needs: [verify, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            pre=()
            case "$VERSION" in *-*) pre=(--prerelease) ;; esac
            gh release create "$VERSION" dist/* --verify-tag --generate-notes "${pre[@]}" --repo "$GITHUB_REPOSITORY"
          fi
