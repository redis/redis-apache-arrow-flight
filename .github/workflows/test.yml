name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs it on the tag it releases.
  workflow_call:
    inputs:
      ref:
        description: The commit to test (default the event's)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Download Go dependencies
        run: go mod download

      - name: Format and vet
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt on: $unformatted"
            exit 1
          fi
          go vet ./...

      # The same Redis as compose.yaml runs locally: standalone, and a
      # 3-shard cluster in one container.
      - name: Start Redis
        run: |
          docker compose up --detach --wait redis
          docker compose --profile cluster up --detach --wait redis-cluster

      - name: Test (standalone)
        env:
          REDIS_URI: redis://localhost:6379/0
        run: go test -count=1 -race ./...

      - name: Test (3-shard cluster)
        env:
          REDIS_URI: redis://localhost:7001/0
        run: go test -count=1 -race ./...

      # The server needs no cgo, so it is statically linked.
      - name: Build
        run: |
          make build
          file bin/redis-flight-server
          file bin/redis-flight-server | grep -q 'statically linked'

      # Real clients (the ADBC Flight SQL driver and pyarrow.flight) against
      # the Docker image.
      # Community has no backend health probe. Wait for a real SQL round trip.
      - name: Python quickstart
        run: |
          docker compose up --detach --build --wait flight
          uv run --with-requirements examples/python/requirements-smoke.txt python scripts/wait-flight.py
          uv run --with-requirements examples/python/requirements-smoke.txt examples/python/quickstart.py
          uv run examples/python/dataset_to_sql.py
          # Optional telemetry is explicitly empty in community builds.
          test "$(curl -fsS -o /tmp/flight-metrics -w '%{http_code}' http://127.0.0.1:9815/metrics)" = 204
          test ! -s /tmp/flight-metrics

      # The Arrow Flight SQL JDBC driver (DBeaver's) against the same server,
      # on each LTS Java it's tested with (Java 23 and later need another JVM
      # option, which the Makefile adds).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: actions/cache@v6
        with:
          path: bin/flight-sql-jdbc-driver-19.0.0.jar
          key: flight-sql-jdbc-driver-19.0.0
      - name: JDBC smoke test
        run: |
          for v in 17 21 25; do
            home=JAVA_HOME_${v}_X64
            echo "::group::Java $v"
            make jdbc-smoke JAVA="${!home}/bin/java"
            echo "::endgroup::"
          done

      - name: Server logs
        if: failure()
        run: docker compose logs flight
