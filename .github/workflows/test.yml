name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs it on the tag it releases.
  workflow_call:
    inputs:
      ref:
        description: The commit to test (default the event's)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download Go dependencies
        run: go mod download

      - name: Format and vet
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt on: $unformatted"
            exit 1
          fi
          go vet ./...

      - name: Release gate and environment script checks
        run: |
          python3 -m py_compile scripts/enterprise-env.py scripts/enterprise-release-gate.py
          python3 -m unittest discover -s scripts -p 'test_enterprise_release_gate.py'
          # Older release commits predate coordinated-release provenance checks.
          # Their source tests must not discover a suite which does not exist.
          if [ -f scripts/test_verify_release_pair.py ]; then
            python3 -m unittest discover -s scripts -p 'test_verify_release_pair.py'
          fi
          python3 -m unittest discover -s scripts -p 'test_run_integration.py'

      # Unit tests exercise core TLS/ACL behavior with isolated test fixtures.
      # Real Redis/Software and paid-feature integration require separately
      # provisioned environments; see docs/sdlc/testing.md.
      - name: Unit tests (community)
        run: env -u REDIS_URI -u REDIS_INTEGRATION_REQUIRED go test -count=1 -race ./...

      # The server needs no cgo, so it is statically linked.
      - name: Build
        run: |
          make build
          file bin/redis-flight-server
          file bin/redis-flight-server | grep -q 'statically linked'
