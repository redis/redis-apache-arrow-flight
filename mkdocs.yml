site_name: Redis Arrow Flight
site_description: SQL queries and Apache Arrow dataset transfers for Redis through Flight SQL, ADBC, JDBC, and native Flight clients.
site_url: https://redis.github.io/redis-apache-arrow-flight/
repo_url: https://github.com/redis/redis-apache-arrow-flight
repo_name: redis/redis-apache-arrow-flight
edit_uri: ''
docs_dir: docs
site_dir: site
hooks:
  - scripts/docs-site.py
theme:
  name: mkdocs
  navigation_depth: 3
  highlightjs: true
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
validation:
  links:
    not_found: warn
    anchors: warn
nav:
  - Home: index.md
  - Get started:
      - Run locally: docs/local-development.md
      - Build profiles: docs/build-profiles.md
      - Choose a data interface: docs/data-access.md
