services:
  redis:
    # Redis 8.x has the Query Engine (RediSearch) built in, which the ADBC
    # driver needs for SQL. Same image the driver tests against.
    image: redis:8.6.2
    container_name: redis-flight-test
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # A 3-shard Redis Cluster (OSS Cluster API) in one container, so the
  # nodes' announced 127.0.0.1 addresses work from the host (the same setup
  # as the Redis ADBC driver's tests). Start it with:
  #   docker compose --profile cluster up --detach --wait redis-cluster
  redis-cluster:
    image: redis:8.6.2
    container_name: redis-flight-cluster
    profiles: ["cluster"]
    ports:
      - "127.0.0.1:7001:7001"
      - "127.0.0.1:7002:7002"
      - "127.0.0.1:7003:7003"
    entrypoint: ["sh", "-c"]
    command:
      - |
        for p in 7001 7002 7003; do
          mkdir -p /data/$$p
          redis-server --port $$p --cluster-enabled yes \
            --cluster-config-file /data/$$p/nodes.conf --dir /data/$$p \
            --cluster-announce-ip 127.0.0.1 --save "" --appendonly no \
            --loadmodule /usr/local/lib/redis/modules/redisearch.so --daemonize yes
        done
        sleep 1
        yes yes | redis-cli --cluster create 127.0.0.1:7001 127.0.0.1:7002 127.0.0.1:7003 --cluster-replicas 0
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7001 cluster info | grep -q cluster_state:ok"]
      interval: 2s
      timeout: 3s
      retries: 30

  flight:
    build: .
    container_name: redis-flight-server
    depends_on:
      redis:
        condition: service_healthy
    environment:
      FLIGHT_LISTEN: 0.0.0.0:8815
      REDIS_URI: redis://redis:6379/0
      # FLIGHT_AUTH: redis-acl
      # FLIGHT_TOKEN_SECRET: change-me
    ports:
      - "127.0.0.1:${FLIGHT_PORT:-8815}:8815"
